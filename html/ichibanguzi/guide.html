<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一番賞 - 圖鑑</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../public/ico/ichibanguzi.ico">
</head>
<body class="relative min-h-screen text-slate-800 overflow-x-hidden
             before:content-[''] before:fixed before:inset-0 before:-z-10
             before:bg-black before:bg-cover">

    <div id="app">
        <div class="flex min-h-screen bg-black">

            <!-- 引入共用導覽列元件 -->
            <nav-bar :topic="this.topicName" :depth="2"></nav-bar>

            <!-- ===== 主內容區域 (手機版：從上方導覽列下方開始 | 電腦版：從左側 220px 開始) ===== -->
            <main id="scroll-area" class="fixed top-16 left-0 right-0 bottom-0 md:top-0 md:left-[220px] md:right-0 md:h-screen overflow-y-auto">
                
                <!-- 讀取中 -->
                <div v-if="loading" class="flex items-center justify-center h-full text-white/60">
                    圖片載入中...
                </div>

                <!-- 錯誤訊息 -->
                <div v-else-if="errorMsg" class="flex items-center justify-center h-full text-red-400">
                    {{ errorMsg }}
                </div>

                <!-- 圖片網格 (手機版：寬度 100%、高度自動 | 電腦版：雙欄、固定高度) -->
                <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
                    <a v-for="img in data" :key="img.id"
                        :href="img.url"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="relative w-full h-auto md:h-80 overflow-hidden group cursor-pointer block">
                        
                        <!-- 圖片：手機版高度自動依比例縮放，電腦版填滿固定高度並保持 object-cover -->
                        <img :src="img.img" :alt="'image-' + img.id"
                            class="w-full h-auto md:h-full md:object-cover transition-transform duration-300 group-hover:scale-105" 
                            loading="lazy">

                        <!-- 遮罩與白色置中文字 -->
                        <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-4">
                            <span class="text-white text-base md:text-lg font-medium tracking-wider text-center drop-shadow-md">
                                {{ img.name }}
                            </span>
                        </div>
                    </a>
                </div>
            </main>
        </div>
    </div>
</body>
<!-- CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Vue3.0  -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<!-- Vue的共用元件 & 邏輯,main.js 之前引入 -->
<script src="../../public/vue-components/nav-bar.js"></script>
<script src="../../public/vue-mixins/scroll-mixin.js"></script>
<!-- 共用主程式 -->
<script type="text/javascript" src="../../public/cm-utils/main.js"></script>
<!-- Google Apps Script -->
<script type="text/javascript" src="../../public/cm-utils/gas.js"></script>

<!-- 頁面主邏輯 -->
<script>
    const { createApp } = Vue;

    createApp({
        // 註冊元件
        components: {
            'nav-bar': NavBar
        },
        data() {
            return {
                topicName:"ichibanguzi",
                data: [],
                loading: true,
                errorMsg: ''
            }
        },
        methods: {
            async fetchData() {
                try {
                    const response = await fetch(`../../public/assets/${this.topicName}/guide_data.json`);
                    if (!response.ok) throw new Error('資料讀取失敗');
                    const list = await response.json();
                    this.data = list.map((item, idx) => ({
                        id: idx,
                        img: item['圖片網址'],
                        name: item['名稱(中文)'],
                        url: item['參考來源'],
                    }));
                } catch (err) {
                    console.error(err);
                    this.errorMsg = '圖片載入失敗,請稍後再試';
                } finally {
                    this.loading = false;
                }
            }
        },
        mounted() {
            this.fetchData();
        }
    }).mount('#app');
</script>
</html>
